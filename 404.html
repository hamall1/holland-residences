<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Holland Residences</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-primary);
        }

        .error-code {
            font-family: var(--font-heading);
            font-weight: 300;
            font-size: clamp(5rem, 15vw, 10rem);
            line-height: 1;
            color: var(--accent);
            opacity: 0.3;
            margin-bottom: -10px;
        }

        .error-title {
            font-family: var(--font-heading);
            font-weight: 300;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .error-message {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.7;
            max-width: 440px;
            margin-bottom: 40px;
        }

        .error-cta {
            display: inline-block;
            padding: 16px 40px;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: 4px;
            transition: background 0.4s ease, transform 0.3s ease;
        }

        .error-cta:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        .error-logo {
            position: absolute;
            top: 32px;
            left: 40px;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <a href="/" class="nav-logo error-logo">Holland<span>Residences</span></a>
        <p class="error-code">404</p>
        <h1 class="error-title">Page not found</h1>
        <p class="error-message">The page you're looking for doesn't exist or has been moved. Head back to explore Holland Residences.</p>
        <a href="/" class="error-cta">Back to Holland Residences</a>
    </div>

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F8JWGZXZE9"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-F8JWGZXZE9');
    </script>
</body>
</html>
